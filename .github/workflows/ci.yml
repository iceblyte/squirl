name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 三平台产物；Windows 为实机验证主目标，macOS/Linux 照发并标注「未实机验证」
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps (webkitgtk)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Frontend gates
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Rust gates（单测；进程类冒烟在 Windows 实机执行，此处跳过 --ignored）
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo test --test spike_c
          cargo test --test ac6_search

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Squirl v__VERSION__"
          releaseBody: |
            Squirl —— 本地项目台账与一键启动中枢。

            **平台验证口径**：Windows 实机验证；macOS / Linux 产物照发、未经实机验证。
            已知限制见 docs/用户文档.md「已知限制」段。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

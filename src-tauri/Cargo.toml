[package]
name = "squirl"
version = "0.1.0"
description = "Squirl —— 本地项目台账与一键启动中枢"
edition = "2024"
default-run = "squirl-app"
rust-version = "1.96"

[lib]
name = "squirl"
crate-type = ["staticlib", "cdylib", "rlib"]

# bin 与 lib 同名会触发 pdb 输出冲突告警（对齐 tauri 模板「lib 带后缀」惯例）
[[bin]]
name = "squirl-app"
path = "src/main.rs"

# B5 崩溃兜底模拟宿主：测试专用（ADR-14），不进发布安装包
[features]
spike-harness = []

[[bin]]
name = "job_host"
path = "src/bin/job_host.rs"
required-features = ["spike-harness"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

# 依赖版本按设计文档 §4.6（2026-11-01 实测）pin 成精确版本；升级走独立评审。
[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-log = "=2.10.1"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-dialog = "=2.8.4"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
] }
tokio-util = "=0.7.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.29.0", features = ["v7"] }
thiserror = "=2.0.17"
tracing = "=0.1.41"
dunce = "=1.0.5"
jwalk = "=0.9.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
nix = { version = "=0.31.3", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "=3.24.0"
tracing-subscriber = "=0.3.20"

[profile.release]
strip = true
lto = true

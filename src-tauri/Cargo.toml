[package]
name = "squirl"
version = "0.1.0"
description = "Squirl —— 本地项目台账与一键启动中枢"
edition = "2024"
rust-version = "1.96"

[lib]
name = "squirl"

# 依赖版本按设计文档 §4.6（2026-11-01 实测）pin 成精确版本；升级走独立评审。
[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"] }
rusqlite_migration = "=2.6.0"
tokio = { version = "=1.54.1", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "sync",
    "time",
    "io-util",
] }
tokio-util = "=0.7.16"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.29.0", features = ["v7"] }
thiserror = "=2.0.17"
tracing = "=0.1.41"
dunce = "=1.0.5"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"
nix = { version = "=0.31.3", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "=3.24.0"
tracing-subscriber = "=0.3.20"

[profile.release]
strip = true
lto = true
